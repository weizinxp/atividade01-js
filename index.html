<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Situação Acadêmica</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --paper: #FBF8EF;
    --ink: #1F2A1D;
    --ink-soft: #5C6B52;
    --rule: #D9CBA0;
    --board: #1E3A28;
    --board-line: #2B4E37;
    --gold: #DDA520;
    --gold-bg: #FBF0D6;
    --blue: #3B72A6;
    --pass: #2E6B3E;
    --pass-bg: #DEEBDD;
    --warn: #B4841C;
    --warn-bg: #FBF0D6;
    --fail: #8B4A2B;
    --fail-bg: #F3E5DA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--board);
    background-image:
      repeating-linear-gradient(0deg, var(--board-line) 0px, var(--board-line) 1px, transparent 1px, transparent 42px);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .sheet {
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    padding: 36px 36px 36px;
    position: relative;
  }

  .sheet::before {
    content: "";
    position: absolute;
    top: 0; left: 46px; bottom: 0;
    width: 1px;
    background: var(--gold);
    opacity: 0.4;
  }

  /* ----- Cabeçalho institucional (logo + nome da escola) ----- */
  .header-escola {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }

  .logo-escola {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo-escola img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .header-texto {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .header-texto .escola-nome {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .header-texto .escola-sub {
    font-size: 12px;
    color: var(--ink-soft);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 27px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--board);
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    margin-top: 18px;
  }

  label:first-of-type { margin-top: 0; }

  input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 10px 2px;
    border: none;
    border-bottom: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus { border-bottom-color: var(--blue); }

  .grades {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
  }

  #recup-wrap {
    display: none;
  }

  #recup-wrap.show { display: block; }

  button {
    width: 100%;
    margin-top: 28px;
    padding: 13px;
    background: var(--board);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.85; }

  .result {
    display: none;
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
  }

  .result.show { display: block; }

  .result-row {
    display: flex;
    justify-content: space-between;
    font-size: 14.5px;
    padding: 5px 0;
    color: var(--ink-soft);
  }

  .result-row span:last-child { color: var(--ink); font-weight: 500; }

  .status {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 2px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    text-align: center;
  }

  .status.aprovado { background: var(--pass-bg); color: var(--pass); }
  .status.recuperacao { background: var(--warn-bg); color: var(--warn); }
  .status.reprovado { background: var(--fail-bg); color: var(--fail); }

  .error {
    display: none;
    color: var(--fail);
    font-size: 13px;
    margin-top: 14px;
  }

  .error.show { display: block; }
</style>
</head>
<body>

  <div class="sheet">

    <div class="header-escola">
      <div class="logo-escola">
        <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b7/Brasaogurinhem2.png/960px-Brasaogurinhem2.png?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="Brasão de Gurinhém">
      </div>
      <div class="header-texto">
        <span class="escola-nome">Flaviano Ribeiro</span>
        <span class="escola-sub">Prefeitura Municipal de Gurinhém</span>
      </div>
    </div>

    <h1>Situação Acadêmica</h1>
    <p class="subtitle">Preencha os dados do aluno para calcular o boletim.</p>

    <label for="nome">Nome do aluno</label>
    <input type="text" id="nome" placeholder="Digite o nome">

    <div class="grades">
      <div>
        <label for="nota1">Nota 1</label>
        <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="0,0">
      </div>
      <div>
        <label for="nota2">Nota 2</label>
        <input type="number" id="nota2" step="0.1" min="0" max="10" placeholder="0,0">
      </div>
    </div>

    <div id="recup-wrap">
      <label for="recup">Nota da recuperação</label>
      <input type="number" id="recup" step="0.1" min="0" max="10" placeholder="0,0">
    </div>

    <button id="calcBtn">Calcular</button>

    <p class="error" id="errorMsg">Preencha as notas corretamente antes de calcular.</p>

    <div class="result" id="result">
      <div class="result-row"><span>Nome</span><span id="rNome"></span></div>
      <div class="result-row"><span>Nota 1</span><span id="rNota1"></span></div>
      <div class="result-row"><span>Nota 2</span><span id="rNota2"></span></div>
      <div class="result-row"><span>Média</span><span id="rMedia"></span></div>
      <div class="result-row" id="rRecupRow" style="display:none;"><span>Nota da recuperação</span><span id="rRecup"></span></div>
      <div class="status" id="rStatus"></div>
    </div>
  </div>

<script src="atividade01.js"></script>

</body>
</html>
